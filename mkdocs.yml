site_name: Matrix Factory Twin — Research Artifacts & Documentation
site_description: Academic companion site, physical formulations, and multi-agent digital twin documentation for Matrix Factory Twin.
site_url: https://utczbr.github.io/Matrix_Factory/

repo_name: utczbr/Matrix_Factory
repo_url: https://github.com/utczbr/Matrix_Factory

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart Guide: getting-started/quickstart.md
      - Architecture Overview: getting-started/architecture-overview.md
  - Architecture:
      - C4 System Context: architecture/c4-system-context.md
      - Time Synchronization Engine: architecture/time-sync-engine.md
      - Holonic Control & 2PC Switching: architecture/holonic-control.md
  - Physical Engine & Physics:
      - Overview & Numba Bridge: physical-engine/overview.md
      - Station 1 - Resin Cure Kinetics: physical-engine/station-1-resin.md
      - Station 2 - Catalyst Coating & ECSA: physical-engine/station-2-coating.md
      - Station 3 - Bipolar Plate Stamping: physical-engine/station-3-stamping.md
      - Station 4 - Assembly & Clamping: physical-engine/station-4-assembly.md
      - Station 5 - PEMFC Electrochemistry: physical-engine/station-5-pemfc.md
      - Literature Calibration & DOIs: physical-engine/literature-calibration.md
  - Multi-Agent System (MAS):
      - JaCaMo & CArtAgO Infrastructure: agents-and-mas/jacamo-structure.md
      - Supervisor Agent: agents-and-mas/supervisor-agent.md
      - Order & Resource Holons: agents-and-mas/order-resource-holons.md
      - AMR Fleet Agents: agents-and-mas/amr-agents.md
  - API & Protocols:
      - gRPC SimBridge & Protobuf: api-and-protocols/grpc-protobuf.md
      - WebSocket Telemetry & HMAC Auth: api-and-protocols/websocket-telemetry.md
      - Database Schema & Async Queue: api-and-protocols/database-schema.md
  - Operations & DevOps:
      - Monte Carlo Parallel Fan-out: operations-and-dev/monte-carlo-scale.md
      - mTLS & Security Configuration: operations-and-dev/security-mtls.md
      - Testing & Verification Protocols: operations-and-dev/testing-calibration.md
  - Artifact Evaluation:
      - 5-Min Reproduction Guide: artifact-evaluation/quick-repro.md
      - Claim-to-Code Matrix: artifact-evaluation/claim-matrix.md
  - Citation: citation.md
